<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Álbum amiibo ACNH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: a collector's binder. Sticky search bar, tabs (Catálogo · Favoritos · Mi isla),
   cards grouped into species "pages" with a jump strip; island = 10 house plots. */
:root {
  --bg: #eef2e6;
  --surface: #ffffff;
  --surface-2: #f6f8f1;
  --ink: #22301e;
  --muted: #627058;
  --line: #d6dfca;
  --leaf: #2f7d4f;
  --leaf-soft: #dcecd9;
  --star: #e7a800;
  --s1: #e07a2f;
  --s2: #2f86c9;
  --s3: #8a59c0;
  --s4: #cf4a77;
  --special: #b8860b;
  --font-display: "Baloo 2", "Nunito Sans", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a13; --surface: #1d251b; --surface-2: #232c21; --ink: #e6eddf; --muted: #9aa890;
    --line: #34402f; --leaf: #6cc28c; --leaf-soft: #23392a; --star: #f5c53d;
    --s1: #f0954f; --s2: #5aa7e3; --s3: #ad86de; --s4: #e8739a; --special: #e0b44a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a13; --surface: #1d251b; --surface-2: #232c21; --ink: #e6eddf; --muted: #9aa890;
  --line: #34402f; --leaf: #6cc28c; --leaf-soft: #23392a; --star: #f5c53d;
  --s1: #f0954f; --s2: #5aa7e3; --s3: #ad86de; --s4: #e8739a; --special: #e0b44a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; }

header.top { padding-block: 20px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 0.82rem; color: var(--muted); letter-spacing: 0.02em; margin-top: 6px; }
.tally { display: flex; gap: 8px; flex-wrap: wrap; }
.tally span { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--leaf); color: var(--surface); }
.tabs button svg { width: 16px; height: 16px; flex: none; }
.tabs .count { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.85; margin-left: 4px; }
.controls { display: grid; gap: 8px; }
.searchrow { display: flex; gap: 8px; }
.ftoggle { display: none; flex: none; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
.ftoggle svg { width: 18px; height: 18px; }
.ftoggle[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge { background: var(--leaf); color: var(--surface); font-size: 0.72rem; font-family: var(--font-mono); min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
select { padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.9rem; max-width: 42%; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 99px; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }

.spsel { width: 100%; max-width: none; padding: 10px 12px; font-size: 16px; font-weight: 700; border-radius: 12px; }
.spsel.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.jump { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 4px; scrollbar-width: thin; }
.jump button { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 4px 9px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
.jump button span { font-family: var(--font-mono); font-weight: 500; color: var(--muted); margin-left: 3px; font-size: 0.72rem; }

main { padding-top: 14px; }
.result-note { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
.group { margin-bottom: 26px; scroll-margin-top: 190px; }
.group h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
.group h2 .em { font-size: 1.4rem; }
.group h2 .n { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; cursor: pointer; text-align: left; display: flex; flex-direction: column; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
@media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px -10px rgba(0,0,0,.35); } }
.card .fav::after, .card .pic::after { content: ""; position: absolute; inset: -7px; }
.card .band { height: 6px; background: var(--sc); }
.card .face { display: grid; place-items: center; font-size: 2.3rem; line-height: 1; height: 62px; background: var(--surface-2); margin: 8px 8px 0; border-radius: 10px; }
.card .meta { padding: 8px 10px 10px; display: grid; gap: 1px; min-width: 0; }
.card .num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--sc); font-weight: 500; }
.card .nm { font-weight: 700; font-size: 0.95rem; line-height: 1.2; overflow-wrap: anywhere; }
.card .en { font-size: 0.74rem; color: var(--muted); overflow-wrap: anywhere; }
.card .tag { margin-top: 4px; font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.card .tag.sp { color: var(--special); }
.card .fav { position: absolute; top: 12px; right: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--line); box-shadow: 0 0 0 1px var(--line); }
.card .fav svg { width: 17px; height: 17px; }
.card .fav[aria-pressed="true"] { color: var(--star); box-shadow: 0 0 0 1px var(--star); }
.card .home { position: absolute; top: 12px; left: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--leaf); color: var(--surface); display: grid; place-items: center; }
.card .home svg { width: 13px; height: 13px; }

.empty { padding: 32px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-bottom: 4px; }

/* Island */
.island-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.island-head h2 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }
.island-head p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.plots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.plot { border-radius: var(--radius); padding: 12px; min-height: 108px; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); }
.plot.free { border-style: dashed; background: transparent; color: var(--muted); justify-content: center; font-size: 0.85rem; font-weight: 600; flex-direction: column; text-align: center; gap: 2px; }
.plot.free b { font-family: var(--font-mono); font-weight: 500; font-size: 0.75rem; }
.plot .em { font-size: 2.2rem; flex: none; }
.plot .info { min-width: 0; flex: 1; display: grid; gap: 2px; }
.plot .info .nm { font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-size: 1rem; }
.plot .info small { color: var(--muted); font-size: 0.78rem; }
.plot .rm { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; cursor: pointer; justify-self: start; margin-top: 4px; }
.island-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel h3 { margin: 0 0 10px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mix { display: grid; gap: 6px; }
.mix .row { display: grid; grid-template-columns: 88px 1fr 22px; gap: 8px; align-items: center; font-size: 0.85rem; }
.mix .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.mix .track i { display: block; height: 100%; background: var(--leaf); border-radius: 4px; }
.mix .row b { font-family: var(--font-mono); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.mix .row.zero { color: var(--muted); }
.bdays { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.88rem; }
.bdays li { display: flex; justify-content: space-between; gap: 8px; }
.bdays li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 9, 0.45); z-index: 20; }
.sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; transform: translateX(-50%); width: min(520px, 100%); background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 30px -12px rgba(0,0,0,.4); max-height: 88vh; overflow-y: auto; }
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translate(-50%, -50%); border-radius: 20px; } }
.sheet .hd { display: flex; gap: 14px; align-items: center; }
.sheet .bigface { width: 82px; height: 82px; border-radius: 16px; display: grid; place-items: center; font-size: 3.1rem; background: var(--surface-2); border-top: 6px solid var(--sc); flex: none; }
.sheet h3 { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.05; margin: 0; }
.sheet .sub { color: var(--muted); font-size: 0.88rem; }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0; font-size: 0.92rem; }
.sheet dt { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.sheet dd { margin: 0; font-weight: 600; }
.sheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn svg { width: 18px; height: 18px; }
.btn.on-fav { background: var(--star); border-color: var(--star); color: #2b2100; }
.btn.on-home { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.sheet .note { font-size: 0.8rem; color: var(--muted); margin: 10px 0 0; }
.sheet .close { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--muted); width: 36px; height: 36px; }

.photo { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 14px; padding: 13px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 800; text-decoration: none; font-size: 1rem; }
.photo svg { width: 20px; height: 20px; }
.photo-alt { display: block; text-align: center; margin-top: 8px; font-size: 0.85rem; font-weight: 700; color: var(--leaf); }
.card .pic { position: absolute; top: 50px; right: 12px; width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.card .pic svg { width: 14px; height: 14px; }
.plot .pic { font-size: 0.75rem; font-weight: 700; color: var(--leaf); }
.sw { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; }
.sw span { display: inline-flex; align-items: center; gap: 5px; }
.sw i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); display: inline-block; }
.face img, .thumb img, .bigcard img { width: 100%; height: 100%; object-fit: contain; display: block; }
.fallback { display: grid; place-items: center; width: 100%; height: 100%; font-size: 2.4rem; }
.grid .card .face { height: auto; aspect-ratio: 276 / 388; display: block; overflow: hidden; border-radius: 8px; }
.plot .thumb { width: 54px; flex: none; aspect-ratio: 276 / 388; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.sheet .hd { align-items: flex-start; }
.bigcard { width: 140px; max-width: 42%; flex: none; aspect-ratio: 276 / 388; border-radius: 10px; overflow: hidden; background: var(--surface-2); border-bottom: 5px solid var(--sc); }
.bigcard .fallback { font-size: 3.4rem; }
.sheet .hd > div:last-child { padding-top: 6px; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-weight: 700; font-size: 0.88rem; z-index: 30; }
.sync { font-size: 0.75rem; color: var(--muted); margin-top: 26px; text-align: center; }

@media (max-width: 700px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  header.top { padding-block: 14px 4px; }
  h1 { font-size: 1.55rem; }
  h1 small { font-size: 0.76rem; margin-top: 4px; }
  .tally { display: none; }
  .bar { padding-block: 8px; gap: 8px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; border-radius: 0; border-width: 1px 0 0; gap: 0;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -6px 18px -14px rgba(0,0,0,.45); }
  .tabs button { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 0.74rem; min-height: 52px; border-radius: 12px; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs .lbl { display: inline-flex; align-items: center; }
  .tabs .count { font-size: 0.68rem; }
  .ftoggle { display: inline-flex; }
  .filters:not(.open) { display: none; }
  .filters { padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; gap: 8px; }
  .filters .sep { display: none; }
  .filters .chip { padding: 8px 12px; font-size: 0.85rem; }
  .filters select { flex: 1 1 140px; max-width: none; padding: 9px 8px; }
  .jump { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; scroll-padding-inline: 16px; }
  .jump::-webkit-scrollbar { display: none; }
  .jump button { padding: 7px 11px; font-size: 0.84rem; }
  main { padding-top: 10px; }
  .group h2 { font-size: 1.2rem; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); text-align: center; }
  .sheet { max-height: 85vh; }
  .sheet h3 { font-size: 1.45rem; }
  .sheet .bigface { width: 70px; height: 70px; font-size: 2.6rem; }
  .sheet .acts .btn { min-height: 48px; }
  .plots { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .plot { min-height: 96px; padding: 10px; gap: 8px; align-items: flex-start; }
  .plot .em { font-size: 1.8rem; }
  .plot .rm { padding: 6px 10px; }
  .island-head h2 { font-size: 1.3rem; }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .card .face { height: 52px; font-size: 2rem; margin: 6px 6px 0; }
  .card .meta { padding: 6px 8px 8px; }
  .card .nm { font-size: 0.86rem; }
  .card .fav { width: 26px; height: 26px; top: 9px; right: 5px; }
  .card .home { top: 9px; left: 5px; width: 20px; height: 20px; }
  .card .pic { top: 40px; right: 9px; width: 24px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Álbum amiibo<small>Animal Crossing · tarjetas de las series 1 a 4</small></h1>
    <div class="tally" id="tally"></div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-all" data-tab="all" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="lbl">Catálogo</span></button>
      <button role="tab" id="tab-fav" data-tab="fav" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg><span class="lbl">Favoritos<span class="count" id="c-fav">0</span></span></button>
      <button role="tab" id="tab-isl" data-tab="isl" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.7v9h5.3v-5.5h3v5.5h5.3v-9h2.7z"/></svg><span class="lbl">Mi isla<span class="count" id="c-isl">0/10</span></span></button>
    </div>
    <div id="catalog-controls" class="controls">
      <div class="searchrow">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Buscar nombre, especie…" autocomplete="off" aria-label="Buscar">
        </label>
        <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros<span class="badge" id="fcount" hidden></span></button>
      </div>
      <div class="filters" id="filters"></div>
      <select id="species" class="spsel" aria-label="Especie"></select>
    </div>
  </div>

  <main id="main"></main>
  <p class="sync" id="sync">Tus favoritos y tu isla se guardan en este navegador.</p>

const EMOJI = {"Cocodrilo":"🐊","Oso hormiguero":"🐜","Oso":"🐻","Osezno":"🧸","Pájaro":"🐦","Toro":"🐂","Gato":"🐱","Gallina":"🐔","Vaca":"🐄","Ciervo":"🦌","Perro":"🐶","Pato":"🦆","Águila":"🦅","Elefante":"🐘","Rana":"🐸","Cabra":"🐐","Gorila":"🦍","Hámster":"🐹","Hipopótamo":"🦛","Caballo":"🐴","Canguro":"🦘","Koala":"🐨","León":"🦁","Mono":"🐵","Ratón":"🐭","Pulpo":"🐙","Avestruz":"🪶","Pingüino":"🐧","Cerdo":"🐷","Conejo":"🐰","Rinoceronte":"🦏","Oveja":"🐑","Ardilla":"🐿️","Tigre":"🐯","Lobo":"🐺","Mapache":"🦝","Erizo":"🦔","Kappa":"🥒","Topo":"⛏️","Jabalí":"🐗","Nutria":"🦦","Zorro":"🦊","Camello":"🐪","Tapir":"🌙","Tortuga":"🐢","Alpaca":"🦙","Mofeta":"🦨","Ajolote":"🦎","Camaleón":"🦎","Castor":"🦫","Calabaza":"🎃","Búho":"🦉","Pelícano":"📮","Perezoso":"🦥","Morsa":"🦭","Pavo":"🦃","Reno":"🦌","Paloma":"🕊️","Pantera":"🐆","León marino":"🦭","Jirafa":"🦒","Pavo real":"🦚","Gaviota":"🕊️"};
const PERS = ["Perezoso","Atlético","Gruñón","Esnob","Normal","Alegre","Presumida","Dulce"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const SERIES_COLOR = {1:"var(--s1)",2:"var(--s2)",3:"var(--s3)",4:"var(--s4)"};
const MAX_ISLAND = 10;
const IMG_BASES = ["https://raw.githubusercontent.com/N3evin/AmiiboAPI/master/images/", "https://cdn.jsdelivr.net/gh/N3evin/AmiiboAPI@master/images/"];
const imgTag = c => `<img src="${IMG_BASES[0]}icon_${c.i}.png" alt="Tarjeta de ${esc(c.es)}" loading="lazy" decoding="async" data-i="${c.i}" data-emoji="${EMOJI[c.sp] || "❔"}">`;
document.addEventListener("error", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.i) return;
  const next = IMG_BASES.findIndex(b => img.src.startsWith(b)) + 1;
  if (next > 0 && next < IMG_BASES.length) { img.src = IMG_BASES[next] + "icon_" + img.dataset.i + ".png"; return; }
  const span = document.createElement("span"); span.className = "fallback"; span.textContent = img.dataset.emoji; img.replaceWith(span);
}, true);
const COLORS = {Aqua:["Turquesa","#3fc1c9"],Beige:["Beis","#d8c19c"],Black:["Negro","#222222"],Blue:["Azul","#3a6fd8"],Brown:["Marrón","#8a5a35"],Colorful:["Multicolor","conic-gradient(#e94b3c,#f2c23a,#4caf50,#3a6fd8,#9b59b6,#e94b3c)"],Gray:["Gris","#9a9a9a"],Green:["Verde","#4caf50"],Orange:["Naranja","#f08a2c"],Pink:["Rosa","#f28fb1"],Purple:["Morado","#8e5cc8"],Red:["Rojo","#d9403a"],White:["Blanco","#ffffff"],Yellow:["Amarillo","#f2cf3a"]};
const photoUrl = c => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(c.en.replace(" - ", " ") + " animal crossing amiibo card " + String(c.n).padStart(3, "0"));
const wikiUrl = c => "https://nookipedia.com/w/index.php?go=Go&search=" + encodeURIComponent(c.en.split(" - ")[0].replace("DJ KK", "K.K. Slider").replace("Pave", "Pavé").replace("Labelle", "Label"));
const BY_NUM = new Map(CARDS.map(c => [c.n, c]));
const coll = new Intl.Collator("es", { sensitivity: "base" });
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
CARDS.forEach(c => { c.key = norm([c.es, c.en, c.sp, c.p || "especial", c.c || "", c.h || "", (c.st || []).join(" "), "#" + String(c.n).padStart(3, "0")].join(" ")); });

const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.7v9h5.3v-5.5h3v5.5h5.3v-9h2.7z"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 7.5h3.2L9 5h6l1.8 2.5H20v11.5H4z"/><circle cx="12" cy="13" r="3.4"/></svg>'
};

// ---------- state ----------
const state = {
  tab: "all", q: "", sort: "species", series: 0, kind: "all", pers: "", species: "",
  favs: new Set(), island: [], showFilters: false
};
const LS_KEY = "acnh-amiibo-v1";
try {
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (saved) { state.favs = new Set(saved.favs || []); state.island = (saved.island || []).filter(n => BY_NUM.get(n)?.v); }
  const ui = JSON.parse(localStorage.getItem(LS_KEY + "-ui") || "null");
  if (ui) { state.sort = ui.sort || state.sort; state.series = ui.series || 0; }
} catch (e) {}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ favs: [...state.favs], island: state.island })); } catch (e) {}
}
function saveUi() {
  try { localStorage.setItem(LS_KEY + "-ui", JSON.stringify({ sort: state.sort, series: state.series })); } catch (e) {}
}

// favs/island changed; the hook where cloud sync will plug in
function scheduleWrite() { saveLocal(); }

// ---------- actions ----------
const toastEl = document.getElementById("toast");
let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2200); }

function toggleFav(n) {
  const c = BY_NUM.get(n);
  if (state.favs.has(n)) { state.favs.delete(n); toast(c.es + " ya no es favorito"); }
  else { state.favs.add(n); toast(c.es + " añadido a favoritos"); }
  scheduleWrite(); render();
}
function toggleIsland(n) {
  const c = BY_NUM.get(n);
  if (!c.v) return;
  const i = state.island.indexOf(n);
  if (i >= 0) { state.island.splice(i, 1); toast(c.es + " se ha mudado de tu isla"); }
  else if (state.island.length >= MAX_ISLAND) { toast("Tu isla ya tiene 10 vecinos. Quita uno primero."); return; }
  else { state.island.push(n); toast(c.es + " vive ahora en tu isla"); }
  scheduleWrite(); render();
}

// ---------- rendering ----------
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const pad = n => "#" + String(n).padStart(3, "0");
const fmtBday = b => { if (!b) return "—"; const [m, d] = b.split("/").map(Number); return d + " de " + MONTHS[m - 1]; };

function cardHTML(c) {
  const fav = state.favs.has(c.n), home = state.island.includes(c.n);
  return `<div class="card" style="--sc:${SERIES_COLOR[c.s]}" data-open="${c.n}" role="button" tabindex="0" aria-label="${esc(c.es)}, tarjeta ${c.n}">
    <div class="band"></div>
    <div class="face">${imgTag(c)}</div>
    ${home ? `<span class="home" title="Vive en tu isla">${ICON.home}</span>` : ""}
    <button class="fav" data-fav="${c.n}" aria-pressed="${fav}" aria-label="${fav ? "Quitar de" : "Añadir a"} favoritos">${ICON.star}</button>
    <div class="meta">
      <span class="num">${pad(c.n)} · S${c.s}</span>
      <span class="nm">${esc(c.es)}</span>
      ${c.es !== c.en ? `<span class="en">${esc(c.en)}</span>` : ""}
      <span class="tag ${c.v ? "" : "sp"}">${c.v ? esc(c.p) : "Especial"}</span>
    </div>
  </div>`;
}

function filtered(base) {
  const q = norm(state.q).trim();
  const terms = q ? q.split(/\s+/) : [];
  return base.filter(c =>
    (!state.series || c.s === state.series) &&
    (state.kind === "all" || (state.kind === "v" ? c.v : !c.v)) &&
    (!state.pers || c.p === state.pers) &&
    (!state.species || c.sp === state.species) &&
    terms.every(t => c.key.includes(t) || (/^\d+$/.test(t) && c.n === Number(t)))
  );
}

function renderFilters(list) {
  const f = document.getElementById("filters");
  const s = [0, 1, 2, 3, 4].map(n => `<button class="chip" data-series="${n}" aria-pressed="${state.series === n}">${n ? `<span class="dot" style="background:${SERIES_COLOR[n]}"></span>Serie ${n}` : "Todas las series"}</button>`).join("");
  const k = [["all", "Vecinos y especiales"], ["v", "Solo vecinos"], ["s", "Solo especiales"]].map(([v, l]) => `<button class="chip" data-kind="${v}" aria-pressed="${state.kind === v}">${l}</button>`).join("");
  const p = `<select id="pers" aria-label="Personalidad"><option value="">Personalidad</option>${PERS.map(x => `<option ${state.pers === x ? "selected" : ""}>${x}</option>`).join("")}</select>`;
  const o = `<select id="sort" aria-label="Ordenar">${[["species","Por especie"],["number","Por nº de tarjeta"],["name","Por nombre"]].map(([v,l]) => `<option value="${v}" ${state.sort === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  f.innerHTML = s + '<span class="sep"></span>' + k + '<span class="sep"></span>' + p + o;
  f.classList.toggle("open", state.showFilters);
  const n = (state.series ? 1 : 0) + (state.kind !== "all" ? 1 : 0) + (state.pers ? 1 : 0);
  const fc = document.getElementById("fcount"); fc.textContent = n; fc.hidden = !n;
  document.getElementById("ftoggle").setAttribute("aria-expanded", String(state.showFilters));
  // species jump strip, computed without the species filter so you can switch
  const saved = state.species; state.species = "";
  const pool = filtered(list); state.species = saved;
  const counts = {};
  pool.forEach(c => counts[c.sp] = (counts[c.sp] || 0) + 1);
  const sps = Object.keys(counts).sort(coll.compare);
  if (state.species && !counts[state.species]) { counts[state.species] = 0; sps.push(state.species); sps.sort(coll.compare); }
  const sel = document.getElementById("species");
  sel.innerHTML = `<option value="">Todas las especies (${sps.length})</option>` +
    sps.map(sp => `<option value="${esc(sp)}" ${state.species === sp ? "selected" : ""}>${EMOJI[sp] || ""}  ${esc(sp)} · ${counts[sp]}</option>`).join("");
  sel.classList.toggle("active", !!state.species);
}

function renderList(list, emptyMsg) {
  const main = document.getElementById("main");
  const items = filtered(list);
  if (!items.length) { main.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  let html = `<p class="result-note">${items.length} ${items.length === 1 ? "tarjeta" : "tarjetas"}</p>`;
  if (state.sort === "species") {
    const groups = {};
    items.forEach(c => (groups[c.sp] ||= []).push(c));
    Object.keys(groups).sort(coll.compare).forEach(sp => {
      const g = groups[sp].sort((a, b) => a.n - b.n);
      html += `<section class="group" id="g-${encodeURIComponent(sp)}"><h2><span class="em" aria-hidden="true">${EMOJI[sp] || ""}</span>${esc(sp)}<span class="n">${g.length}</span></h2><div class="grid">${g.map(cardHTML).join("")}</div></section>`;
    });
  } else {
    const s = [...items].sort(state.sort === "name" ? (a, b) => coll.compare(a.es, b.es) : (a, b) => a.n - b.n);
    html += `<div class="grid">${s.map(cardHTML).join("")}</div>`;
  }
  main.innerHTML = html;
}

function renderIsland() {
  const main = document.getElementById("main");
  const res = state.island.map(n => BY_NUM.get(n));
  let plots = res.map(c => `<div class="plot" style="--sc:${SERIES_COLOR[c.s]}">
      <span class="thumb">${imgTag(c)}</span>
      <div class="info">
        <button class="nm" data-open="${c.n}">${esc(c.es)}</button>
        <small>${esc(c.sp)} · ${esc(c.p)}</small>
        <small>${pad(c.n)} · Serie ${c.s}</small>
        <button class="rm" data-island="${c.n}">Mudar</button>
      </div></div>`).join("");
  for (let i = res.length; i < MAX_ISLAND; i++) plots += `<div class="plot free"><b>Parcela ${i + 1}</b>Libre</div>`;

  const pc = {}; res.forEach(c => pc[c.p] = (pc[c.p] || 0) + 1);
  const max = Math.max(1, ...Object.values(pc));
  const mix = PERS.map(p => `<div class="row ${pc[p] ? "" : "zero"}"><span>${p}</span><span class="track"><i style="width:${(pc[p] || 0) / max * 100}%"></i></span><b>${pc[p] || 0}</b></div>`).join("");

  const today = new Date(); const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const bd = res.filter(c => c.b).map(c => {
    const [m, d] = c.b.split("/").map(Number);
    let dt = new Date(t0.getFullYear(), m - 1, d); if (dt < t0) dt = new Date(t0.getFullYear() + 1, m - 1, d);
    return { c, days: Math.round((dt - t0) / 864e5) };
  }).sort((a, b) => a.days - b.days);
  const bdl = bd.length ? `<ul class="bdays">${bd.map(({ c, days }) => `<li><span>${EMOJI[c.sp]} ${esc(c.es)} · ${fmtBday(c.b)}</span><span>${days === 0 ? "¡hoy!" : days === 1 ? "mañana" : "en " + days + " días"}</span></li>`).join("")}</ul>` : `<p class="result-note" style="margin:0">Añade vecinos para ver sus cumpleaños.</p>`;

  main.innerHTML = `<div class="island-head"><h2>Mi isla</h2><p>${res.length} de ${MAX_ISLAND} parcelas ocupadas. Añade vecinos desde el catálogo con el botón «Vive en mi isla».</p></div>
    <div class="plots">${plots}</div>
    <div class="island-stats">
      <div class="panel"><h3>Personalidades</h3><div class="mix">${mix}</div></div>
      <div class="panel"><h3>Próximos cumpleaños</h3>${bdl}</div>
    </div>`;
}

function renderTally() {
  const v = CARDS.filter(c => c.v).length;
  document.getElementById("tally").innerHTML = `<span>400 tarjetas</span><span>${v} vecinos</span><span>${400 - v} especiales</span>`;
  document.getElementById("c-fav").textContent = state.favs.size;
  document.getElementById("c-isl").textContent = state.island.length + "/10";
}

function render() {
  renderTally();
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  document.getElementById("catalog-controls").hidden = state.tab === "isl";
  if (state.tab === "isl") { renderIsland(); }
  else {
    const base = state.tab === "fav" ? CARDS.filter(c => state.favs.has(c.n)) : CARDS;
    renderFilters(base);
    renderList(base, state.tab === "fav" && !state.favs.size
      ? "<strong>Aún no tienes favoritos</strong>Toca la estrella de cualquier tarjeta para guardarla aquí."
      : "<strong>Ninguna tarjeta coincide</strong>Prueba con otro nombre o quita algún filtro.");
  }
  if (openNum) renderSheet(openNum);
}

// ---------- detail sheet ----------
let openNum = null, lastFocus = null;
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
function renderSheet(n) {
  const c = BY_NUM.get(n);
  const fav = state.favs.has(n), home = state.island.includes(n), full = state.island.length >= MAX_ISLAND;
  const rows = [["Especie", c.sp], ["Tarjeta", pad(c.n) + " · Serie " + c.s]];
  if (c.v) rows.push(["Personalidad", c.p], ["Sexo", c.g === "M" ? "Macho" : "Hembra"], ["Cumpleaños", fmtBday(c.b)], ["Muletilla", "«" + c.c + "»"], ["Afición", c.h], ["Estilo", c.st.join(" · ")]);
  else rows.push(["Tipo", "Personaje especial"], ["Cumpleaños", fmtBday(c.b)]);
  sheet.innerHTML = `<button class="close" data-close aria-label="Cerrar">×</button>
    <div class="hd" style="--sc:${SERIES_COLOR[c.s]}"><div class="bigcard">${imgTag(c).replace(' loading="lazy"', "")}</div>
      <div><h3 id="sh-name">${esc(c.es)}</h3>${c.en !== c.es ? `<div class="sub">${esc(c.en)}</div>` : ""}<div class="sub">${esc(c.sp)}${c.v ? " · " + esc(c.p) : ""}</div></div></div>
    <a class="photo-alt" data-link href="${wikiUrl(c)}" target="_blank" rel="noopener">Ficha completa en Nookipedia ↗</a>
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}${c.co ? `<dt>Colores</dt><dd class="sw">${c.co.map(k => `<span><i style="background:${COLORS[k][1]}"></i>${COLORS[k][0]}</span>`).join("")}</dd>` : ""}</dl>
    <div class="acts">
      <button class="btn ${fav ? "on-fav" : ""}" data-fav="${n}">${ICON.star}${fav ? "Favorito" : "Marcar favorito"}</button>
      <button class="btn ${home ? "on-home" : ""}" data-island="${n}" ${!c.v || (full && !home) ? "disabled" : ""}>${ICON.home}${home ? "Vive en mi isla" : "Añadir a mi isla"}</button>
    </div>
    ${!c.v ? `<p class="note">Los personajes especiales no pueden mudarse a la isla.</p>` : full && !home ? `<p class="note">Tu isla ya tiene 10 vecinos.</p>` : home ? `<p class="note">Toca de nuevo para que se mude.</p>` : ""}`;
}
function openSheet(n) {
  lastFocus = document.activeElement; openNum = n; renderSheet(n);
  sheet.hidden = false; scrim.hidden = false; sheet.querySelector(".close").focus();
}
function closeSheet() { openNum = null; sheet.hidden = true; scrim.hidden = true; lastFocus?.focus?.(); }

// ---------- events ----------
document.addEventListener("click", e => {
  if (e.target.closest("[data-link]")) return;
  const t = e.target.closest("[data-fav],[data-island],[data-open],[data-close],[data-series],[data-kind],[data-sp],[data-tab]");
  if (!t) { if (e.target === scrim) closeSheet(); return; }
  if (t.dataset.fav) { e.stopPropagation(); toggleFav(+t.dataset.fav); }
  else if (t.dataset.island) toggleIsland(+t.dataset.island);
  else if (t.dataset.open) openSheet(+t.dataset.open);
  else if ("close" in t.dataset) closeSheet();
  else if (t.dataset.series !== undefined) { state.series = +t.dataset.series; saveUi(); render(); }
  else if (t.dataset.kind) { state.kind = t.dataset.kind; render(); }
  else if (t.dataset.sp !== undefined) {
    state.species = state.species === t.dataset.sp ? "" : t.dataset.sp; render(); window.scrollTo({ top: 0, behavior: "smooth" });
    document.querySelector(`#jump [data-sp="${CSS.escape(state.species)}"]`)?.scrollIntoView({ inline: "center", block: "nearest" });
  }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; state.species = ""; render(); window.scrollTo({ top: 0 }); }
});
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openNum) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card")) { e.preventDefault(); openSheet(+e.target.dataset.open); }
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("ftoggle").addEventListener("click", () => { state.showFilters = !state.showFilters; render(); });
document.addEventListener("change", e => {
  if (e.target.id === "pers") { state.pers = e.target.value; render(); }
  if (e.target.id === "species") { state.species = e.target.value; render(); window.scrollTo({ top: 0 }); }
  if (e.target.id === "sort") { state.sort = e.target.value; saveUi(); render(); }
});

render();
</script>

</body>
</html>
